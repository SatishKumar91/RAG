[project]
name = "01-document-loaders"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "lxml>=6.1.3",
    "pdfminer-six>=20260107",
    "pdfplumber>=0.11.10",
    "pypdf>=6.18.0",
    "pytesseract>=0.3.13",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.scripts]
01-document-loaders = "document_loaders.main:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "document_loaders"
